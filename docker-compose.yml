name: concesionaria-tec

networks:
  concesionaria-net:
    driver: bridge

services:
  # Base de datos SQL Server
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: concesionaria_db
    restart: unless-stopped

    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=SqlS3rv3r_2026!
      - MSSQL_PID=Developer
      - MSSQL_AGENT_ENABLED=True

    ports:
      - "${DB_PORT:-1433}:1433"

    networks:
      - concesionaria-net

    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./init.sql:/tmp/init.sql
      - ./jobs.sql:/tmp/jobs.sql
      - ./backups:/var/opt/mssql/backups

    command:
      - /bin/bash
      - -c
      - |
        /opt/mssql/bin/sqlservr &

        echo 'Esperando a SQL Server...'

        until /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'SqlS3rv3r_2026!' -C -Q 'SELECT 1' > /dev/null 2>&1
        do
          sleep 5
        done

        echo 'SQL Server iniciado correctamente'

        echo 'Ejecutando init.sql...'
        /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'SqlS3rv3r_2026!' -C -i /tmp/init.sql

        echo 'Ejecutando jobs.sql...'
        /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'SqlS3rv3r_2026!' -C -i /tmp/jobs.sql

        echo 'Base de datos lista'

        wait

    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "SqlS3rv3r_2026!" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Base de datos no relacional para bitacoras
  mongo:
    image: mongo:7
    container_name: concesionaria_mongo
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: concesionaria
      MONGO_INITDB_ROOT_PASSWORD: NoSqlS3rv3r_2026!
      MONGO_INITDB_DATABASE: ConcesionariaNoSql

    ports:
      - "${MONGO_PORT:-27017}:27017"

    networks:
      - concesionaria-net

    volumes:
      - mongo_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

    healthcheck:
      test: mongosh --quiet --username concesionaria --password NoSqlS3rv3r_2026! --authenticationDatabase admin --eval "db.adminCommand('ping').ok" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./app
      dockerfile: Dockerfile

    container_name: concesionaria_backend
    restart: unless-stopped

    env_file:
      - .env

    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlserver://db:1433;databaseName=ConcesionariaTec;encrypt=true;trustServerCertificate=true;
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.SQLServerDialect
      SPRING_MONGODB_URI: mongodb://concesionaria:NoSqlS3rv3r_2026!@mongo:27017/ConcesionariaNoSql?authSource=admin

    ports:
      - "${BACKEND_PORT:-8080}:8080"

    networks:
      - concesionaria-net

    volumes:
      - ./uploads:/app/uploads

    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: concesionaria_frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "${FRONTEND_PORT:-8081}:80"

    networks:
      - concesionaria-net

volumes:
  sqlserver_data:
  mongo_data:
